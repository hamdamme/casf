name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  UV_PYTHON_DOWNLOADS: never
  CASF_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    name: ${{ matrix.check-name }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            check-name: test
          - os: macos-15
            check-name: test macos
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RQ4 collection tests inspect a pinned historical commit and its history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fixed tooling
        run: |
          python -m venv "$RUNNER_TEMP/casf-tools"
          "$RUNNER_TEMP/casf-tools/bin/python" -m pip install "uv==0.13.5"
          echo "$RUNNER_TEMP/casf-tools/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: uv sync --locked --extra witness --extra dev --group build --python "$(command -v python)"
      - name: Record source validation environment
        run: .venv/bin/python tests/validation_environment.py --import-mode source --output "$RUNNER_TEMP/casf-validation/environment.json"
      - name: Check lockfile
        run: uv lock --check
      - name: Lint
        run: .venv/bin/ruff check src tests benchmarks examples
      - name: Type check
        run: .venv/bin/mypy src
      - name: Test suite
        run: >-
          .venv/bin/python -m pytest tests/ -v --hypothesis-show-statistics
          --junitxml="$RUNNER_TEMP/casf-validation/pytest.xml"
          | tee "$RUNNER_TEMP/casf-validation/pytest.log"
      - name: Bounded parser fuzzing
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/casf-fuzz"
          for seed in 20261110 47 9007199254740991; do
            .venv/bin/python -m tests.fuzz --seed "$seed" --cases 2000 --failures "$RUNNER_TEMP/casf-fuzz" | tee -a "$RUNNER_TEMP/casf-fuzz/summary.jsonl"
          done
      - name: Preserve parser fuzz evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parser-fuzz-locked-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/casf-fuzz/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build package
        run: uv build --python .venv/bin/python --no-build-isolation --out-dir "$RUNNER_TEMP/casf-dist"
      - name: Check installed wheel
        env:
          PYTHONPATH: ""
        run: |
          uv export --locked --no-default-groups --no-emit-project --output-file "$RUNNER_TEMP/casf-runtime.txt" > /dev/null
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/casf-wheel"
          uv pip install --python "$RUNNER_TEMP/casf-wheel/bin/python" --require-hashes -r "$RUNNER_TEMP/casf-runtime.txt"
          uv pip install --python "$RUNNER_TEMP/casf-wheel/bin/python" --no-deps "$RUNNER_TEMP"/casf-dist/*.whl
          "$RUNNER_TEMP/casf-wheel/bin/python" -I tests/validation_environment.py --import-mode wheel --output "$RUNNER_TEMP/casf-validation/base-wheel-environment.json"
          "$RUNNER_TEMP/casf-wheel/bin/python" -I -c "import casf; print(casf.__version__)"
          "$RUNNER_TEMP/casf-wheel/bin/casf" --help
          "$RUNNER_TEMP/casf-wheel/bin/python" -I tests/wheel_smoke.py
          "$RUNNER_TEMP/casf-wheel/bin/python" -I tests/public_fixture.py "$RUNNER_TEMP/casf-public"
          "$RUNNER_TEMP/casf-wheel/bin/python" -I tests/public_verify.py "$RUNNER_TEMP/casf-public"
          uv export --locked --extra witness --no-default-groups --no-emit-project --output-file "$RUNNER_TEMP/casf-witness.txt" > /dev/null
          uv pip install --python "$RUNNER_TEMP/casf-wheel/bin/python" --require-hashes -r "$RUNNER_TEMP/casf-witness.txt"
          "$RUNNER_TEMP/casf-wheel/bin/python" -I tests/validation_environment.py --import-mode wheel --output "$RUNNER_TEMP/casf-validation/witness-wheel-environment.json"
          "$RUNNER_TEMP/casf-wheel/bin/python" -I tests/wheel_smoke.py --witness
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-locked-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/casf-validation/
          if-no-files-found: error
          retention-days: 14

  minimum:
    name: ${{ matrix.check-name }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            check-name: minimum
          - os: macos-15
            check-name: minimum macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RQ4 collection tests inspect a pinned historical commit and its history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fixed tooling
        run: |
          python -m venv "$RUNNER_TEMP/casf-tools"
          "$RUNNER_TEMP/casf-tools/bin/python" -m pip install "uv==0.13.5"
          echo "$RUNNER_TEMP/casf-tools/bin" >> "$GITHUB_PATH"
      - name: Read declared dependency bounds
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          output = Path(os.environ["RUNNER_TEMP"])
          runtime = metadata["project"]["dependencies"]
          runtime += metadata["project"]["optional-dependencies"]["witness"]
          (output / "casf-minimum.in").write_text("\n".join(runtime) + "\n")
          backend = metadata["build-system"]["requires"]
          (output / "casf-backend.in").write_text("\n".join(backend) + "\n")
          PY
      - name: Install minimum direct dependencies
        run: |
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/casf-minimum"
          uv pip install --python "$RUNNER_TEMP/casf-minimum/bin/python" --resolution lowest-direct -r "$RUNNER_TEMP/casf-minimum.in" -r "$RUNNER_TEMP/casf-backend.in"
          uv pip install --python "$RUNNER_TEMP/casf-minimum/bin/python" "pytest==9.1.1" "hypothesis==6.170.9" "build==1.6.1" "wheel==0.45.1"
          uv pip check --python "$RUNNER_TEMP/casf-minimum/bin/python"
          uv pip freeze --python "$RUNNER_TEMP/casf-minimum/bin/python"
      - name: Build with minimum backend
        run: '"$RUNNER_TEMP/casf-minimum/bin/python" -m build --no-isolation --outdir "$RUNNER_TEMP/casf-minimum-dist"'
      - name: Install wheel and record validation environment
        run: |
          uv pip install --python "$RUNNER_TEMP/casf-minimum/bin/python" --no-deps "$RUNNER_TEMP"/casf-minimum-dist/*.whl
          "$RUNNER_TEMP/casf-minimum/bin/python" -I tests/validation_environment.py --import-mode wheel --output "$RUNNER_TEMP/casf-validation/environment.json"
      - name: Test installed wheel
        run: >-
          "$RUNNER_TEMP/casf-minimum/bin/python" -m pytest tests/ -v --hypothesis-show-statistics
          --junitxml="$RUNNER_TEMP/casf-validation/pytest.xml"
          | tee "$RUNNER_TEMP/casf-validation/pytest.log"
      - name: Check installed wheel
        run: |
          "$RUNNER_TEMP/casf-minimum/bin/python" -I tests/wheel_smoke.py --witness
          "$RUNNER_TEMP/casf-minimum/bin/python" -I tests/public_fixture.py "$RUNNER_TEMP/casf-public"
          "$RUNNER_TEMP/casf-minimum/bin/python" -I tests/public_verify.py "$RUNNER_TEMP/casf-public"

      - name: Bounded parser fuzzing
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/casf-fuzz"
          for seed in 20261110 47 9007199254740991; do
            "$RUNNER_TEMP/casf-minimum/bin/python" -m tests.fuzz --seed "$seed" --cases 2000 --failures "$RUNNER_TEMP/casf-fuzz" | tee -a "$RUNNER_TEMP/casf-fuzz/summary.jsonl"
          done
      - name: Preserve parser fuzz evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parser-fuzz-minimum-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/casf-fuzz/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-minimum-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/casf-validation/
          if-no-files-found: error
          retention-days: 14

# These jobs run the committed test suite. Coverage limits are recorded in
# docs/release/test-coverage-status.md; candidate gates are in checklist-v0.1.md.
# Actions are pinned by commit ID.
