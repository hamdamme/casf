[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casf"
version = "0.1.0.dev0"
description = "Cryptographic Audit & Signing Framework: verifiable audit records with conditional rollback detection using independently retained witness state"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "cryptography>=41.0",
]

[project.optional-dependencies]
witness = []   # HTTP stack selected at M0 (ADR-004); populated when chosen
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[dependency-groups]
build = ["build>=1.2", "setuptools==84.2.1"]

[tool.uv]
required-version = "==0.13.5"
build-constraint-dependencies = ["setuptools==84.2.1"]

[project.scripts]
casf = "casf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
