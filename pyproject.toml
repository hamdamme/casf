[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "casf"
version = "0.1.0rc4"
description = "Cryptographic Audit & Signing Framework: verifiable audit records with conditional rollback detection using independently retained witness state"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Hamdam Aynazarov"}]
keywords = ["audit log", "tamper evidence", "ed25519", "transparency", "witness", "rollback detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=50.0.0",
]

[project.urls]
Repository = "https://github.com/hamdamme/casf"
Documentation = "https://github.com/hamdamme/casf/blob/main/docs/README.md"
Issues = "https://github.com/hamdamme/casf/issues"
Changelog = "https://github.com/hamdamme/casf/blob/main/CHANGELOG.md"
Security = "https://github.com/hamdamme/casf/security/policy"

[project.optional-dependencies]
witness = ["uvicorn==0.54.0", "h11>=0.16.0"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[dependency-groups]
build = ["build>=1.2", "setuptools==84.2.1"]

[tool.uv]
required-version = "==0.13.5"
build-constraint-dependencies = ["setuptools==84.2.1"]

[project.scripts]
casf = "casf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
casf = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
